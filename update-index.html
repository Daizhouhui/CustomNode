<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./style/ico.png" type="image/png">
    <script>
        const REPO_OWNER = "DaiZhouHui";
        const REPO_NAME = "CustomNode";
    </script>
    <title>节点仓库主页控制台</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #827ce5;
            --secondary: #10b981;
            --secondary-dark: #059669;
            --accent: #f59e0b;
            --accent-dark: #d97706;
            --danger: #ef4444;
            --dark: #1e293b;
            --light: #f8fafc;
            --gray: #64748b;
            --gray-light: #e2e8f0;
            --border: #cbd5e1;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .update-container {
            max-width: 1040px;
            margin: 0 auto;
            background: white;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 40px);
        }

        /* 头部 */
        .update-header {
            padding: 20px 30px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            flex-shrink: 0;
        }

        .update-header h1 {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            transition: all 0.3s;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: white;
            transform: translateX(-5px);
        }

        /* 主体：左右两栏（触发 + 状态） */
        .update-main {
            display: grid;
            grid-template-columns: 2fr 3fr;
            gap: 20px;
            padding: 20px 25px 0;
        }

        .card {
            background: white;
            border: 1px solid var(--gray-light);
            border-radius: 10px;
            padding: 22px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
        }

        .card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .card h2 {
            font-size: 17px;
            font-weight: 700;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-desc {
            font-size: 14px;
            color: var(--gray);
            margin-bottom: 16px;
        }

        /* 触发更新 */
        .field-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 6px;
        }

        .token-input {
            width: 100%;
            padding: 11px 14px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            background: var(--light);
            transition: all 0.3s;
        }

        .token-input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .hint {
            font-size: 12px;
            color: var(--gray);
            margin: 8px 0 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .trigger-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.35);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .trigger-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.45);
        }

        .trigger-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .trigger-message {
            margin-top: 12px;
            font-size: 13px;
            font-weight: 600;
            min-height: 20px;
            color: var(--gray);
        }

        .trigger-message.success { color: var(--secondary-dark); }
        .trigger-message.error { color: var(--danger); }

        /* 运行状态 */
        .refresh-btn {
            border: none;
            background: var(--light);
            color: var(--primary);
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: var(--primary);
            color: white;
        }

        .schedule-row {
            font-size: 14px;
            color: var(--gray);
            background: var(--light);
            border: 1px solid var(--gray-light);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .run-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .run-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border: 1px solid var(--gray-light);
            border-radius: 8px;
            text-decoration: none;
            color: var(--dark);
            font-size: 14px;
            transition: all 0.2s;
        }

        .run-item:hover {
            border-color: var(--primary);
            background: #f0f9ff;
        }

        .run-item.latest {
            border-color: rgba(99, 102, 241, 0.45);
            background: rgba(99, 102, 241, 0.04);
        }

        .run-state {
            font-size: 12px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .state-success { color: var(--secondary-dark); background: rgba(16, 185, 129, 0.12); }
        .state-failure { color: var(--danger); background: rgba(239, 68, 68, 0.12); }
        .state-cancelled { color: var(--gray); background: var(--gray-light); }
        .state-queued { color: var(--accent-dark); background: rgba(245, 158, 11, 0.12); }
        .state-running { color: var(--primary-dark); background: rgba(99, 102, 241, 0.12); }

        .run-num {
            font-weight: 700;
            color: var(--primary-dark);
            white-space: nowrap;
        }

        .run-event {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--light);
            border: 1px solid var(--border);
            color: var(--gray);
            white-space: nowrap;
        }

        .run-time {
            margin-left: auto;
            color: var(--gray);
            font-size: 13px;
            white-space: nowrap;
        }

        .status-empty, .status-error {
            font-size: 14px;
            color: var(--gray);
            padding: 14px 4px;
        }

        .status-error { color: var(--danger); }

        .actions-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 14px;
            font-size: 13px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .actions-link:hover { color: var(--primary-dark); }

        /* 操作日志 */
        .log-card {
            margin: 20px 25px 25px;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 240px;
        }

        .log-output {
            background: #1a1a1a;
            color: #4ecdc4;
            padding: 16px 18px;
            border-radius: 8px;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 13px;
            flex: 1;
            overflow-y: auto;
            line-height: 1.7;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
            min-height: 160px;
            max-height: 340px;
        }

        .log-entry {
            margin-bottom: 8px;
            display: flex;
            gap: 10px;
        }

        .log-time {
            color: #aaa;
            min-width: 70px;
            font-size: 12px;
            flex-shrink: 0;
        }

        .log-success { color: #32cd32; }
        .log-error { color: #ff6b6b; }
        .log-info { color: #4ecdc4; }
        .log-warning { color: #ffa500; }

        /* 底部 */
        .update-footer {
            padding: 12px 25px;
            background: var(--light);
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--gray);
            text-align: center;
            flex-shrink: 0;
        }

        .update-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .update-footer a:hover { color: var(--primary-dark); }

        /* 响应式 */
        @media (max-width: 992px) {
            .update-main {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            body { padding: 10px 5px; }

            .update-container {
                min-height: calc(100vh - 20px);
                border-radius: 8px;
            }

            .update-header {
                padding: 15px 20px;
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .update-header h1 {
                font-size: 19px;
                justify-content: center;
            }

            .back-btn { justify-content: center; }

            .update-main { padding: 15px 15px 0; }
            .card { padding: 16px; }
            .log-card { margin: 15px 15px 20px; }
        }

        @media (max-width: 480px) {
            body { padding: 5px 0; }

            .update-container {
                min-height: 100vh;
                border-radius: 0;
            }

            .update-header { padding: 12px 15px; }
            .update-header h1 { font-size: 17px; }
            .update-main { padding: 12px 12px 0; gap: 12px; }
            .card { padding: 14px; }
            .log-card { margin: 12px 12px 15px; }

            .run-item { flex-wrap: wrap; padding: 8px 10px; gap: 8px; }
            .run-time { margin-left: 0; width: 100%; font-size: 12px; }
            .log-time { min-width: 58px; }
        }

        /* 滚动条 */
        .log-output::-webkit-scrollbar { width: 6px; }
        .log-output::-webkit-scrollbar-track { background: #2a2a2a; border-radius: 3px; }
        .log-output::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }
    </style>

</head>
<body>
    <div class="update-container">
        <!-- 头部 -->
        <div class="update-header">
            <h1><i class="fas fa-sync-alt"></i> 节点仓库主页控制台</h1>
            <a href="/" class="back-btn">
                <i class="fas fa-arrow-left"></i>
                返回主页面
            </a>
        </div>

        <!-- 主体：触发更新 + 运行状态 -->
        <div class="update-main">
            <!-- 触发更新 -->
            <div class="card">
                <div class="card-head">
                    <h2><i class="fas fa-play-circle"></i> 手动触发更新</h2>
                </div>
                <p class="card-desc">
                    触发 update-index 工作流：重新扫描仓库节点文件，重建索引页 index.html 与文件清单 files_info.json。
                </p>
                <p class="hint">
                    <i class="fas fa-shield-alt"></i>
                    使用 Worker 服务端令牌触发，无需在本页输入 GitHub Token
                </p>
                <button class="trigger-btn" id="triggerBtn" onclick="triggerUpdate()">
                    <i class="fas fa-bolt"></i>
                    立即更新
                </button>
                <p class="trigger-message" id="triggerMessage" role="status"></p>
            </div>

            <!-- 运行状态 -->
            <div class="card">
                <div class="card-head">
                    <h2><i class="fas fa-activity"></i> 工作流运行状态</h2>
                    <button class="refresh-btn" onclick="loadStatus(true)">
                        <i class="fas fa-redo"></i>
                        刷新
                    </button>
                </div>
                <div class="schedule-row">
                    <i class="far fa-clock"></i>
                    <span>定时执行：每日 07:00（北京时间）· 仓库文件推送时也会自动触发</span>
                </div>
                <div class="run-list" id="runsContainer">
                    <div class="status-empty">正在获取运行记录...</div>
                </div>
                <a class="actions-link"
                   href="https://github.com/DaiZhouHui/CustomNode/actions/workflows/update-index.yml"
                   target="_blank" rel="noopener">
                    在 GitHub Actions 查看全部记录
                    <i class="fas fa-external-link-alt"></i>
                </a>
            </div>
        </div>

        <!-- 操作日志 -->
        <div class="card log-card">
            <div class="card-head">
                <h2><i class="fas fa-terminal"></i> 操作日志</h2>
                <button class="refresh-btn" onclick="clearLog()">
                    <i class="fas fa-trash"></i>
                    清空日志
                </button>
            </div>
            <div id="updateOutput" class="log-output">
                <div class="log-entry log-info">
                    <span class="log-time">[系统]</span>
                    <span>更新控制台已就绪</span>
                </div>
            </div>
        </div>

        <!-- 底部 -->
        <div class="update-footer">
            <span>
                索引页面由 GitHub Actions 工作流
                <a href="https://github.com/DaiZhouHui/CustomNode/actions/workflows/update-index.yml" target="_blank" rel="noopener">update-index.yml</a>
                自动生成并提交
            </span>
        </div>
    </div>

    <script>
        const WORKFLOW_FILE = "update-index.yml";
        const WORKER_RUNS_URL = "/api/workflow-runs";
        const WORKER_TRIGGER_URL = "/api/trigger-update";
        const EVENT_LABELS = { schedule: "定时", push: "推送", workflow_dispatch: "手动" };

        let latestRunId = null;     // 已知的最新一次运行ID，用于识别新触发的运行
        let trackingActive = false; // 防止重复启动进度跟踪

        // 写入一条真实日志（内容用 textContent 构建，避免注入）
        function addLog(message, type = "info") {
            const output = document.getElementById("updateOutput");
            const entry = document.createElement("div");
            entry.className = `log-entry log-${type}`;

            const time = document.createElement("span");
            time.className = "log-time";
            time.textContent = `[${new Date().toLocaleTimeString("zh-CN", { hour12: false })}]`;

            const text = document.createElement("span");
            text.textContent = message;

            entry.append(time, text);
            output.prepend(entry);
            output.scrollTop = 0;
        }

        async function fetchJSON(url, options = {}) {
            const response = await fetch(url, { credentials: "same-origin", ...options });
            if (response.status === 401) {
                throw new Error("登录已过期，请刷新页面重新登录");
            }
            if (!response.ok) {
                let message = `HTTP ${response.status}`;
                try {
                    const body = await response.json();
                    if (body && typeof body.error === "string") {
                        message = body.error;
                    }
                } catch {
                    // 无法解析错误体时保留 HTTP 状态码
                }
                throw new Error(message);
            }
            return response.json();
        }

        // 按钮下方的即时反馈
        function showTriggerMessage(text, type = "info") {
            const element = document.getElementById("triggerMessage");
            element.textContent = text;
            element.className = `trigger-message ${type}`;
        }

        // 运行耗时，如 "1分12秒"
        function formatDuration(isoStart, isoEnd) {
            const seconds = Math.max(0, Math.round((new Date(isoEnd) - new Date(isoStart)) / 1000));
            if (seconds < 60) return `${seconds}秒`;
            const minutes = Math.floor(seconds / 60);
            const rest = seconds % 60;
            return rest ? `${minutes}分${rest}秒` : `${minutes}分钟`;
        }

        // 运行状态 -> 中文标签 + 样式
        function runState(run) {
            if (run.status === "queued") {
                return { label: "排队中", cls: "state-queued", icon: "fas fa-hourglass-half" };
            }
            if (run.status === "in_progress") {
                return { label: "运行中", cls: "state-running", icon: "fas fa-spinner fa-spin" };
            }
            switch (run.conclusion) {
                case "success": return { label: "成功", cls: "state-success", icon: "fas fa-check-circle" };
                case "failure": return { label: "失败", cls: "state-failure", icon: "fas fa-times-circle" };
                case "cancelled": return { label: "已取消", cls: "state-cancelled", icon: "fas fa-ban" };
                default: return { label: run.conclusion || "未知", cls: "state-cancelled", icon: "fas fa-question-circle" };
            }
        }

        // 构建单条运行记录（最新一条高亮，悬浮显示对应提交信息）
        function buildRunItem(run, isLatest) {
            const state = runState(run);
            const item = document.createElement("a");
            item.className = `run-item${isLatest ? " latest" : ""}`;
            item.href = run.html_url;
            item.target = "_blank";
            item.rel = "noopener";

            if (run.head_commit_message) {
                item.title = run.head_commit_message;
            }

            const stateSpan = document.createElement("span");
            stateSpan.className = `run-state ${state.cls}`;
            const stateIcon = document.createElement("i");
            stateIcon.className = state.icon;
            stateSpan.append(stateIcon, ` ${state.label}`);

            const num = document.createElement("span");
            num.className = "run-num";
            num.textContent = `#${run.run_number}`;

            const event = document.createElement("span");
            event.className = "run-event";
            event.textContent = EVENT_LABELS[run.event] || run.event;

            const time = document.createElement("span");
            time.className = "run-time";
            const started = new Date(run.created_at).toLocaleString("zh-CN", { hour12: false });
            time.textContent = run.status === "completed"
                ? `${started} · ${formatDuration(run.created_at, run.updated_at)}`
                : started;

            item.append(stateSpan, num, event, time);
            return item;
        }

        // 加载最近 5 次真实运行记录（公开仓库无需令牌）
        async function loadStatus(manual = false) {
            const container = document.getElementById("runsContainer");
            try {
                const data = await fetchJSON(WORKER_RUNS_URL);
                const runs = (data.workflow_runs || []).slice(0, 5);

                container.innerHTML = "";
                if (!runs.length) {
                    const empty = document.createElement("div");
                    empty.className = "status-empty";
                    empty.textContent = "暂无运行记录";
                    container.appendChild(empty);
                    return;
                }

                latestRunId = runs[0].id;
                runs.forEach((run, index) => container.appendChild(buildRunItem(run, index === 0)));

                // 页面打开时如果正有运行在执行，自动跟踪到它结束
                if (runs[0].status !== "completed") {
                    addLog(`检测到正在进行的运行 #${runs[0].run_number}，将自动跟踪进度`, "info");
                    trackRun(runs[0].id);
                }
            } catch (error) {
                container.innerHTML = "";
                const tip = document.createElement("div");
                tip.className = "status-error";
                tip.textContent = `无法获取运行记录：${error.message}`;
                container.appendChild(tip);
                if (manual) {
                    addLog(`刷新运行状态失败: ${error.message}`, "error");
                }
            }
        }

        // 轮询跟踪某次运行直到结束（15秒一次，最多 6 分钟）
        function trackRun(runId) {
            if (trackingActive) return;
            trackingActive = true;

            let attempts = 0;
            const timer = setInterval(async () => {
                attempts += 1;
                if (attempts > 24) {
                    clearInterval(timer);
                    trackingActive = false;
                    addLog("已停止自动跟踪，可点击刷新按钮查看最新结果", "warning");
                    return;
                }
                try {
                    const run = await fetchJSON(`${WORKER_RUNS_URL}/${runId}`);
                    if (run.status === "completed") {
                        clearInterval(timer);
                        trackingActive = false;
                        if (run.conclusion === "success") {
                            addLog(`✅ 运行 #${run.run_number} 已完成（耗时 ${formatDuration(run.created_at, run.updated_at)}）`, "success");
                        } else {
                            addLog(`⚠️ 运行 #${run.run_number} 已结束：${runState(run).label}`, "warning");
                        }
                        loadStatus();
                    }
                } catch (error) {
                    // 网络波动时跳过本次，等待下一次轮询
                }
            }, 15000);
        }

        // 触发后等待新运行出现，再转交 trackRun 跟踪
        function trackNewRun(baselineId) {
            if (baselineId === null) {
                addLog("无法自动跟踪进度（运行记录接口不可用），请稍后点击刷新查看结果", "warning");
                return;
            }

            let attempts = 0;
            const timer = setInterval(async () => {
                attempts += 1;
                if (attempts > 12) {
                    clearInterval(timer);
                    addLog("未检测到新的运行，请稍后点击刷新查看结果", "warning");
                    return;
                }
                try {
                    const data = await fetchJSON(WORKER_RUNS_URL);
                    const top = (data.workflow_runs || [])[0];
                    if (top && top.id !== baselineId) {
                        clearInterval(timer);
                        latestRunId = top.id;
                        addLog(`检测到新的运行 #${top.run_number}，开始跟踪执行进度...`, "info");
                        loadStatus();
                        trackRun(top.id);
                    }
                } catch (error) {
                    // 继续下一次轮询
                }
            }, 15000);
        }

        // 触发更新工作流（唯一入口，使用 Worker 服务端令牌）
        async function triggerUpdate() {
            const button = document.getElementById("triggerBtn");
            const originalContent = button.innerHTML;

            button.disabled = true;
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在触发...';
            showTriggerMessage("正在触发 update-index 工作流...", "info");
            addLog("正在触发 update-index 工作流...", "info");

            try {
                await fetchJSON(WORKER_TRIGGER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Accept": "application/json" },
                    body: "{}",
                });
                showTriggerMessage("✅ 已触发，正在等待运行开始...", "success");
                addLog("✅ 工作流已触发，正在等待运行开始...", "success");
                trackNewRun(latestRunId);
            } catch (error) {
                showTriggerMessage(`❌ 触发失败：${error.message}`, "error");
                addLog(`❌ 触发失败：${error.message}`, "error");
            } finally {
                button.disabled = false;
                button.innerHTML = originalContent;
            }
        }

        // 清空日志
        function clearLog() {
            const output = document.getElementById("updateOutput");
            output.innerHTML = "";
            addLog("日志已清空", "info");
        }

        // 页面加载：拉取真实运行状态
        document.addEventListener("DOMContentLoaded", () => {
            loadStatus();
        });
    </script>
</body>
</html>
