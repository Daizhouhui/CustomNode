<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./style/ico.png" type="image/png">
    <script>
        const REPO_OWNER = "DaiZhouHui";
        const REPO_NAME = "CustomNode";
    </script>
    <title>节点仓库主页控制台</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #827ce5;
            --secondary: #10b981;
            --secondary-dark: #059669;
            --accent: #f59e0b;
            --accent-dark: #d97706;
            --danger: #ef4444;
            --dark: #1e293b;
            --light: #f8fafc;
            --gray: #64748b;
            --gray-light: #e2e8f0;
            --border: #cbd5e1;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .update-container {
            max-width: 1040px;
            margin: 0 auto;
            background: white;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 40px);
        }

        /* 头部 */
        .update-header {
            padding: 20px 30px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            flex-shrink: 0;
        }

        .update-header h1 {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            transition: all 0.3s;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: white;
            transform: translateX(-5px);
        }

        /* 主体：左右两栏（触发 + 状态） */
        .update-main {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            padding: 20px 25px 0;
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border: 1px solid var(--gray-light);
            border-radius: 10px;
            padding: 22px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
        }

        .card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .card h2 {
            font-size: 17px;
            font-weight: 700;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-desc {
            font-size: 14px;
            color: var(--gray);
            margin-bottom: 16px;
        }

        /* 触发更新 */
        .field-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 6px;
        }

        .token-input {
            width: 100%;
            padding: 11px 14px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            background: var(--light);
            transition: all 0.3s;
        }

        .token-input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .hint {
            font-size: 12px;
            color: var(--gray);
            margin: 8px 0 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .trigger-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.35);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .trigger-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.45);
        }

        .trigger-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .trigger-message {
            margin-top: 12px;
            font-size: 13px;
            font-weight: 600;
            min-height: 20px;
            color: var(--gray);
        }

        .trigger-message.success { color: var(--secondary-dark); }
        .trigger-message.error { color: var(--danger); }

        /* 运行状态 */
        .refresh-btn {
            border: none;
            background: var(--light);
            color: var(--primary);
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: var(--primary);
            color: white;
        }

        .actions-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 14px;
            font-size: 13px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .actions-link:hover { color: var(--primary-dark); }

        /* 操作日志 */
        .log-card {
            margin: 20px 25px 25px;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 240px;
        }

        .log-output {
            background: #1a1a1a;
            color: #4ecdc4;
            padding: 16px 18px;
            border-radius: 8px;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 13px;
            flex: 1;
            overflow-y: auto;
            line-height: 1.7;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
            min-height: 160px;
            max-height: 340px;
        }

        .log-entry {
            margin-bottom: 8px;
            display: flex;
            gap: 10px;
        }

        .log-time {
            color: #aaa;
            min-width: 70px;
            font-size: 12px;
            flex-shrink: 0;
        }

        .log-success { color: #32cd32; }
        .log-error { color: #ff6b6b; }
        .log-info { color: #4ecdc4; }
        .log-warning { color: #ffa500; }

        /* 底部 */
        .update-footer {
            padding: 12px 25px;
            background: var(--light);
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--gray);
            text-align: center;
            flex-shrink: 0;
        }

        .update-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .update-footer a:hover { color: var(--primary-dark); }

        /* 响应式 */
        @media (max-width: 768px) {
            body { padding: 10px 5px; }

            .update-container {
                min-height: calc(100vh - 20px);
                border-radius: 8px;
            }

            .update-header {
                padding: 15px 20px;
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .update-header h1 {
                font-size: 19px;
                justify-content: center;
            }

            .back-btn { justify-content: center; }

            .update-main { padding: 15px 15px 0; }
            .card { padding: 16px; }
            .log-card { margin: 15px 15px 20px; }
        }

        @media (max-width: 480px) {
            body { padding: 5px 0; }

            .update-container {
                min-height: 100vh;
                border-radius: 0;
            }

            .update-header { padding: 12px 15px; }
            .update-header h1 { font-size: 17px; }
            .update-main { padding: 12px 12px 0; gap: 12px; }
            .card { padding: 14px; }
            .log-card { margin: 12px 12px 15px; }

            .run-item { flex-wrap: wrap; padding: 8px 10px; gap: 8px; }
            .run-time { margin-left: 0; width: 100%; font-size: 12px; }
            .log-time { min-width: 58px; }
        }

        /* 滚动条 */
        .log-output::-webkit-scrollbar { width: 6px; }
        .log-output::-webkit-scrollbar-track { background: #2a2a2a; border-radius: 3px; }
        .log-output::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="update-container">
        <!-- 头部 -->
        <div class="update-header">
            <h1><i class="fas fa-sync-alt"></i> 节点仓库主页控制台</h1>
            <a href="/" class="back-btn">
                <i class="fas fa-arrow-left"></i>
                返回主页面
            </a>
        </div>

        <!-- 主体：触发更新 -->
        <div class="update-main">
            <div class="card">
                <div class="card-head">
                    <h2><i class="fas fa-play-circle"></i> 手动触发更新</h2>
                </div>
                <p class="card-desc">
                    触发 update-index 工作流：重新扫描仓库节点文件，重建索引页 index.html 与文件清单 files_info.json。
                    每日 07:00（北京时间）以及仓库文件推送时也会自动执行。
                </p>
                <p class="hint">
                    <i class="fas fa-shield-alt"></i>
                    使用 Worker 服务端令牌触发，无需在本页输入 GitHub Token
                </p>
                <button class="trigger-btn" id="triggerBtn" onclick="triggerUpdate()">
                    <i class="fas fa-bolt"></i>
                    立即更新
                </button>
                <p class="trigger-message" id="triggerMessage" role="status"></p>
                <a class="actions-link"
                   href="https://github.com/DaiZhouHui/CustomNode/actions/workflows/update-index.yml"
                   target="_blank" rel="noopener">
                    在 GitHub Actions 查看运行结果
                    <i class="fas fa-external-link-alt"></i>
                </a>
            </div>
        </div>

        <!-- 操作日志 -->
        <div class="card log-card">
            <div class="card-head">
                <h2><i class="fas fa-terminal"></i> 操作日志</h2>
                <button class="refresh-btn" onclick="clearLog()">
                    <i class="fas fa-trash"></i>
                    清空日志
                </button>
            </div>
            <div id="updateOutput" class="log-output">
                <div class="log-entry log-info">
                    <span class="log-time">[系统]</span>
                    <span>更新控制台已就绪</span>
                </div>
            </div>
        </div>

        <!-- 底部 -->
        <div class="update-footer">
            <span>
                索引页面由 GitHub Actions 工作流
                <a href="https://github.com/DaiZhouHui/CustomNode/actions/workflows/update-index.yml" target="_blank" rel="noopener">update-index.yml</a>
                自动生成并提交
            </span>
        </div>
    </div>

    <script>
        const WORKER_TRIGGER_URL = "/api/trigger-update";

        // 写入一条真实日志（内容用 textContent 构建，避免注入）
        function addLog(message, type = "info") {
            const output = document.getElementById("updateOutput");
            const entry = document.createElement("div");
            entry.className = `log-entry log-${type}`;

            const time = document.createElement("span");
            time.className = "log-time";
            time.textContent = `[${new Date().toLocaleTimeString("zh-CN", { hour12: false })}]`;

            const text = document.createElement("span");
            text.textContent = message;

            entry.append(time, text);
            output.prepend(entry);
            output.scrollTop = 0;
        }

        async function fetchJSON(url, options = {}) {
            const response = await fetch(url, { credentials: "same-origin", ...options });
            if (response.status === 401) {
                throw new Error("登录已过期，请刷新页面重新登录");
            }
            if (!response.ok) {
                let message = `HTTP ${response.status}`;
                try {
                    const body = await response.json();
                    if (body && typeof body.error === "string") {
                        message = body.error;
                    }
                } catch {
                    // 无法解析错误体时保留 HTTP 状态码
                }
                throw new Error(message);
            }
            return response.json();
        }

        // 按钮下方的即时反馈
        function showTriggerMessage(text, type = "info") {
            const element = document.getElementById("triggerMessage");
            element.textContent = text;
            element.className = `trigger-message ${type}`;
        }

        // 触发更新工作流（唯一入口，使用 Worker 服务端令牌）
        async function triggerUpdate() {
            const button = document.getElementById("triggerBtn");
            const originalContent = button.innerHTML;

            button.disabled = true;
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在触发...';
            showTriggerMessage("正在触发 update-index 工作流...", "info");
            addLog("正在触发 update-index 工作流...", "info");

            try {
                await fetchJSON(WORKER_TRIGGER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Accept": "application/json" },
                    body: "{}",
                });
                showTriggerMessage("✅ 工作流已成功触发，请到 GitHub Actions 查看执行结果", "success");
                addLog("✅ 工作流已成功触发，请到 GitHub Actions 查看执行结果", "success");
            } catch (error) {
                showTriggerMessage(`❌ 触发失败：${error.message}`, "error");
                addLog(`❌ 触发失败：${error.message}`, "error");
            } finally {
                button.disabled = false;
                button.innerHTML = originalContent;
            }
        }

        // 清空日志
        function clearLog() {
            const output = document.getElementById("updateOutput");
            output.innerHTML = "";
            addLog("日志已清空", "info");
        }
    </script>
</body>
</html>
